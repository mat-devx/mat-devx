<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" width="300" height="330" role="img" aria-label="MV monogram, Mathew Valiente">
  <title>MV — Mathew Valiente</title>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0C0D"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFAFA"/>
      <stop offset="1" stop-color="#A9AEB6"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="card">
      <rect x="1" y="1" width="298" height="328" rx="14"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="298" height="328" rx="14" fill="url(#surface)"/>

  <g clip-path="url(#card)">
    <ellipse cx="150" cy="104" rx="186" ry="118" fill="url(#orb)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 12 -9; 0 0" dur="24s" repeatCount="indefinite"/>
    </ellipse>

    <!--
      MV is vector geometry, not a font glyph, so it renders identically for every
      viewer. Scale/translate lives on this single wrapper; each letter then only
      animates transform + opacity on its own <g>.
    -->
    <g transform="translate(34,58) scale(15)">
      <g>
        <path fill="url(#ink)" d="M0,9 L0,0 L2,0 L3.5,3.6 L5,0 L7,0 L7,9 L5,9 L5,3.4 L3.5,6.4 L2,3.4 L2,9 Z"/>
        <animate attributeName="opacity" values="0;1" dur="0.75" begin="0.12" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        <animateTransform attributeName="transform" type="translate" values="0 0.9;0 0" dur="0.75" begin="0.12" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
      </g>
      <g>
        <path fill="url(#ink)" transform="translate(8.4,0)" d="M0,0 L2,0 L3.5,5.5 L5,0 L7,0 L3.5,9 Z"/>
        <animate attributeName="opacity" values="0;1" dur="0.75" begin="0.42" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        <animateTransform attributeName="transform" type="translate" values="0 0.9;0 0" dur="0.75" begin="0.42" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
      </g>
    </g>

    <!--
      Reveal animations are attached to wrapper <g> elements, never to <text>.
      Putting animateTransform inside <text> interacts badly with text-anchor.
      Base state is fully legible if SMIL never runs.
    -->
    <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, 'Cascadia Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace" text-anchor="middle">
      <g>
        <animate attributeName="opacity" values="0;1" dur="0.7" begin="0.72" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        <animateTransform attributeName="transform" type="translate" values="0 6;0 0" dur="0.7" begin="0.72" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        <text x="150" y="236" font-size="13" font-weight="600" letter-spacing="2.2" fill="#FAFAFA" xml:space="preserve">MATHEW VALIENTE</text>
      </g>
      <g>
        <animate attributeName="opacity" values="0;1" dur="0.7" begin="0.88" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        <animateTransform attributeName="transform" type="translate" values="0 6;0 0" dur="0.7" begin="0.88" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        <text x="150" y="258" font-size="10.5" letter-spacing="1.1" fill="#6E7480" xml:space="preserve">@mat-devx</text>
      </g>
    </g>

    <g>
      <animate attributeName="opacity" values="0;1" dur="0.8" begin="1" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
      <rect x="60" y="280" width="180" height="1" fill="url(#rule)"/>
    </g>

    <g>
      <animate attributeName="opacity" values="0;1" dur="0.7" begin="1.12" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
      <text x="150" y="304" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, 'Cascadia Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="9.5" letter-spacing="1.2" fill="#5A6069" xml:space="preserve">BS IT &#183; AI ENGINEERING TRACK</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="328" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
  <rect x="6" y="6" width="288" height="318" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
</svg>
