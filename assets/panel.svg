    <linearGradient id="prule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="porb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="pcard">
      <rect x="1" y="1" width="558" height="328" rx="14"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="558" height="328" rx="14" fill="url(#psurface)"/>

