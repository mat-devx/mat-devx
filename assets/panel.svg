<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-label="Profile data: role, focus, stack, shipped, impact, projects, location, availability">
  <title>Profile data</title>

  <defs>
    <linearGradient id="psurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0C0D"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>

    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
