<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 248" width="860" height="248" role="img" aria-label="Terminal session for Mathew Valiente — AI Engineer, Voice AI, LLM + RAG, Full-Stack, open to work, Dipolog City Philippines">
  <title>Mathew Valiente — hermes session</title>

  <defs>
    <linearGradient id="agent-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090A0C"/>
      <stop offset="0.52" stop-color="#050608"/>
      <stop offset="1" stop-color="#020304"/>
    </linearGradient>
    <radialGradient id="agent-glow" cx="18%" cy="50%" r="65%">
      <stop offset="0" stop-color="#A7F3D0" stop-opacity="0.055"/>
      <stop offset="0.55" stop-color="#A7F3D0" stop-opacity="0.012"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="agent-frame">
      <rect x="1" y="1" width="858" height="246" rx="14"/>
    </clipPath>
  </defs>
  <rect x="1" y="1" width="858" height="246" rx="14" fill="url(#agent-bg)"/>

  <g clip-path="url(#agent-frame)">
    <rect x="0" y="0" width="860" height="248" fill="url(#agent-glow)"/>

    <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, 'Cascadia Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace">

      <!-- minimal agent runtime -->
      <g>
        <circle cx="25" cy="22" r="3" fill="#A7F3D0"/>
        <text x="37" y="26" font-size="10.5" letter-spacing="1.2" fill="#8A929D">AGENT</text>
        <text x="86" y="26" font-size="10.5" fill="#454C55">/</text>
        <text x="99" y="26" font-size="10.5" letter-spacing="1.2" fill="#686F79">MATHEW</text>
        <text x="836" y="26" text-anchor="end" font-size="10" letter-spacing="1.1" fill="#454C55">SESSION 01</text>
      </g>

      <line x1="24" y1="40" x2="836" y2="40" stroke="#FFFFFF" stroke-opacity="0.065"/>

      <!-- opening command -->
      <g>
        <text x="28" y="63" font-size="11" fill="#A7F3D0">›</text>
        <text x="42" y="63" font-size="11" fill="#8A929D">initialize identity</text>
        <text x="836" y="63" text-anchor="end" font-size="10" fill="#4E565F">autonomous runtime</text>
      </g>

      <!-- compact execution trace -->
      <g>
        <text x="28" y="87" font-size="10.5" fill="#A7F3D0">●</text>
        <text x="42" y="87" font-size="10.5" fill="#737B85">agent</text>
        <text x="94" y="87" font-size="10.5" fill="#C3C8CF">loading context</text>
        <text x="836" y="87" text-anchor="end" font-size="10" fill="#555D67">done</text>

        <line x1="31" y1="94" x2="31" y2="119" stroke="#30363E" stroke-width="1"/>

        <text x="43" y="108" font-size="9.8" fill="#505862">tool</text>
        <text x="82" y="108" font-size="9.8" fill="#777F89">profile.yaml</text>
        <text x="210" y="108" font-size="9.8" fill="#4E565F">→</text>
        <text x="228" y="108" font-size="9.8" fill="#6E7680">identity</text>

        <text x="43" y="123" font-size="9.8" fill="#505862">tool</text>
        <text x="82" y="123" font-size="9.8" fill="#777F89">capabilities</text>
        <text x="210" y="123" font-size="9.8" fill="#4E565F">→</text>
        <text x="228" y="123" font-size="9.8" fill="#6E7680">04 tools</text>
      </g>

      <!-- identity returned by the agent -->
      <g>
        <text x="28" y="151" font-size="10.5" fill="#A7F3D0">◆</text>
        <text x="43" y="151" font-size="10.5" fill="#68717B">response</text>

        <text x="28" y="181" font-size="31" font-weight="600" letter-spacing="1.0" fill="#F2F4F5">MATHEW VALIENTE</text>
        <text x="29" y="202" font-size="12.5" letter-spacing="0.25" fill="#858D97">AI Engineer · Voice AI · LLM + RAG · Full-Stack</text>
      </g>

      <!-- waiting state -->
      <g>
        <line x1="28" y1="216" x2="836" y2="216" stroke="#FFFFFF" stroke-opacity="0.055"/>
        <text x="28" y="235" font-size="10.5" fill="#A7F3D0">›</text>
        <text x="42" y="235" font-size="10.5" fill="#555E68">ready for instruction</text>
        <rect x="181" y="226" width="5" height="12" rx="1" fill="#A7F3D0" opacity="0.85">
          <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
        <text x="836" y="235" text-anchor="end" font-size="10" letter-spacing="0.8" fill="#4E565F">TOOLS 04 · CONTEXT 42%</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="858" height="246" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>

</svg>
